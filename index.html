<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2022 개정 정보과 성취기준 빈칸 학습 (랜덤 빈칸)</title>
  <style>
    :root {
      --primary-color: #00897b;
      --primary-hover: #00695c;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --correct-bg: #dcfce7;
      --correct-border: #22c55e;
      --correct-text: #15803d;
      --incorrect-bg: #fee2e2;
      --incorrect-border: #ef4444;
      --incorrect-text: #b91c1c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 20px;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-size: 1.8rem; font-weight: 700; color: #1e293b; margin-bottom: 6px; }
    header p { color: var(--text-muted); font-size: 0.95rem; }

    /* 과목 탭 */
    .tabs-nav {
      display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px;
      border-bottom: 1px solid #cbd5e1; padding-bottom: 0; align-items: flex-end;
    }
    .tab-btn {
      padding: 12px 20px; border: 1px solid transparent; background: transparent;
      color: #64748b; font-weight: bold; font-size: 1.05rem; cursor: pointer;
      transition: all 0.2s ease; margin-bottom: -1px;
    }
    .tab-btn:hover { color: #334155; }
    .tab-btn.active {
      border: 1.5px solid #000000; border-bottom: 4px solid var(--primary-color);
      color: var(--primary-color); background: var(--card-bg); border-radius: 4px 4px 0 0;
    }

    /* 단원 서브 탭 */
    .unit-selector {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px;
      padding: 12px; background: #f1f5f9; border-radius: 8px;
    }
    .unit-btn {
      padding: 6px 14px; border: 1px solid var(--border-color); background: var(--card-bg);
      border-radius: 20px; font-size: 0.9rem; font-weight: 600; color: var(--text-muted);
      cursor: pointer; transition: all 0.2s;
    }
    .unit-btn:hover { background: #e2e8f0; color: #1e293b; }
    .unit-btn.active {
      background: var(--primary-color); color: white; border-color: var(--primary-color);
    }

    /* 컨트롤바 */
    .controls {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      background: var(--card-bg); padding: 14px 18px; border-radius: 12px;
      border: 1px solid var(--border-color); margin-bottom: 20px; gap: 12px;
    }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .action-btn {
      padding: 8px 14px; border: none; border-radius: 6px; font-weight: 600;
      font-size: 0.9rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-shuffle { background: #8b5cf6; color: white; }
    .btn-check { background: #10b981; color: white; }
    .btn-toggle-ans { background: #64748b; color: white; }
    .btn-reset { background: #f43f5e; color: white; }
    .score-board { font-weight: 700; font-size: 1.05rem; color: #1e293b; }

    /* 퀴즈 영역 */
    .quiz-card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 12px; padding: 24px; margin-bottom: 20px;
    }
    .quiz-section { margin-bottom: 40px; }
    .quiz-section h3 {
      font-size: 1.25rem; color: var(--primary-color); margin-bottom: 20px;
      background: #f0fdfa; display: inline-block; padding: 8px 16px; border-radius: 20px;
      border: 1px solid #ccfbf1;
    }
    .quiz-item { margin-bottom: 14px; font-size: 1.02rem; line-height: 1.8; color: #334155; padding-left: 8px; }

    /* 내용체계 표 스타일 */
    .content-table {
      width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 20px;
      background: #ffffff; font-size: 0.95rem; border-radius: 8px; overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .content-table th, .content-table td {
      border: 1px solid var(--border-color); padding: 10px 14px; text-align: left; vertical-align: middle;
    }
    .content-table th {
      background-color: #f1f5f9; color: #1e293b; font-weight: 700; white-space: nowrap; text-align: center;
    }
    .content-table .sub-header {
      background-color: #f8fafc; width: 110px; text-align: center; font-weight: 600;
    }
    .content-table td { line-height: 1.8; color: #334155; }

    /* 영역 구분선 및 소제목 */
    .section-divider {
      border: 0; height: 1px; background: #cbd5e1; margin: 24px 0;
    }
    .sub-section-title {
      font-size: 1.1rem; font-weight: 700; color: #1e293b; margin-bottom: 14px;
      padding-left: 10px; border-left: 4px solid var(--primary-color);
    }

    /* 빈칸 입력 */
    .blank-input {
      display: inline-block; min-width: 80px; padding: 4px 8px; margin: 0 4px;
      border: 2px solid #cbd5e1; border-radius: 6px; font-size: 0.98rem;
      text-align: center; font-weight: 600; outline: none; background: #f8fafc;
    }
    .blank-input:focus { border-color: var(--primary-color); background: #ffffff; }
    .blank-input.correct { background-color: var(--correct-bg); border-color: var(--correct-border); color: var(--correct-text); }
    .blank-input.incorrect { background-color: var(--incorrect-bg); border-color: var(--incorrect-border); color: var(--incorrect-text); }
    
    .ans-hint { font-size: 0.9rem; color: #2563eb; font-weight: bold; margin-left: 6px; }
    .hidden { display: none !important; }
  </style>
</head>

// 배열 셔플 함수
function shuffleArray(array) {
  const newArr = [...array];
  for (let i = newArr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
  }
  return newArr;
}

// 텍스트에서 랜덤하게 단어를 골라 빈칸(input)으로 변환하는 함수
function createRandomBlanks(rawString) {
    const pureText = rawString.replace(/[{}]/g, '');
    
    // 코드 및 범주 영역은 빈칸에서 제외
    const codeRegex = /^\[.*?\]\s*/;
    const codeMatch = pureText.match(codeRegex);
    const codePart = codeMatch ? codeMatch[0] : '';
    const textPart = pureText.replace(codeRegex, '');
    
    // 빈칸을 뚫을 후보 단어 (한글/영문/숫자로 된 2글자 이상의 덩어리)
    const wordsRegex = /[가-힣a-zA-Z0-9·]{2,}/g;
    let matches = [...textPart.matchAll(wordsRegex)];
    
    if (matches.length === 0) return pureText;
    
    let maxBlanks = textPart.length > 80 ? 4 : 3;
    const blankCount = Math.floor(Math.random() * maxBlanks) + 1; 
    const selectedMatches = [];
    const availableIndexes = Array.from(matches.keys());
    
    for (let i = 0; i < blankCount; i++) {
        if (availableIndexes.length === 0) break;
        const r = Math.floor(Math.random() * availableIndexes.length);
        const matchIndex = availableIndexes.splice(r, 1)[0];
        selectedMatches.push(matches[matchIndex]);
    }
    
    selectedMatches.sort((a, b) => b.index - a.index);
    
    let resultHtml = textPart;
    selectedMatches.forEach(match => {
        const word = match[0];
        const inputWidth = Math.max(word.length * 18, 50);
        const inputHtml = `<input type="text" class="blank-input" data-ans="${word}" style="width: ${inputWidth}px;" autocomplete="off" /><span class="ans-hint hidden">(${word})</span>`;
        
        resultHtml = resultHtml.substring(0, match.index) + 
                     inputHtml + 
                     resultHtml.substring(match.index + word.length);
    });
    
    return codePart + resultHtml;
}

function renderTableItem(tableData) {
    const renderBulletList = (arr) => arr.map(str => `• ${createRandomBlanks(str)}`).join('<br>');

    return `
    <div class="sub-section-title">내용 체계</div>
    <table class="content-table">
      <thead>
        <tr>
          <th colspan="2" style="width:22%;">범주</th>
          <th>내용 요소</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th colspan="2">핵심 아이디어</th>
          <td>${renderBulletList(tableData.ideas)}</td>
        </tr>
        <tr>
          <th rowspan="3" style="vertical-align:middle; text-align:center;">내용 요소</th>
          <th class="sub-header">지식·이해</th>

        </tr>
        <tr>

      </tbody>
    </table>`;
}

function generateQuiz(isShuffle) {
  const container = document.getElementById('quizContent');
  showAnswers = false;
  
  const cats = categories[currentTab];
  let html = '';
  
  cats.forEach(cat => {
    if (currentUnit !== 'all' && currentUnit !== cat.id) return;
    
    const dbKey = `${currentTab}_성취기준_${cat.id}`;
    let items = db[dbKey];
    
    if (items && items.length > 0) {
      html += `<div class="quiz-section"><h3>${cat.name}</h3>`;
      
      const tableItem = items.find(item => item.type === 'table');
      let standards = items.filter(item => item.type !== 'table' && !item.q.startsWith('[해설]') && !item.q.startsWith('[고려사항]'));
      let explanations = items.filter(item => item.type !== 'table' && item.q.startsWith('[해설]'));
      let considerations = items.filter(item => item.type !== 'table' && item.q.startsWith('[고려사항]'));

      if (isShuffle) {
        standards = shuffleArray(standards);
        explanations = shuffleArray(explanations);
        considerations = shuffleArray(considerations);
      }

      if (tableItem) {
        html += renderTableItem(tableItem.data);
      }

      if (standards.length > 0) {
        if (tableItem) html += `<hr class="section-divider">`;
        
        // '설계' 탭(총론/교과역량)인 경우 '성취기준' 타이틀을 렌더링하지 않음
        if (currentTab !== '설계') {
          html += `<div class="sub-section-title">성취기준</div>`;
        }
        
        standards.forEach((item) => {
          html += `<div class="quiz-item">• ${createRandomBlanks(item.q)}</div>`;
        });
      }

      if (explanations.length > 0) {
        if (tableItem || standards.length > 0) html += `<hr class="section-divider">`;
        html += `<div class="sub-section-title">성취기준 해설</div>`;
        explanations.forEach((item) => {
          html += `<div class="quiz-item">• ${createRandomBlanks(item.q)}</div>`;
        });
      }

      if (considerations.length > 0) {
        if (tableItem || standards.length > 0 || explanations.length > 0) html += `<hr class="section-divider">`;
        html += `<div class="sub-section-title">성취기준 적용 시 고려사항</div>`;
        considerations.forEach((item) => {
          html += `<div class="quiz-item">• ${createRandomBlanks(item.q)}</div>`;
        });
      }
      
      html += `</div>`;
    }
  });

  if (html === '') {
    html = '<p style="color:#64748b; margin-top:20px;">해당 단원의 데이터가 없습니다.</p>';
  }

  container.innerHTML = html;
  updateScoreDisplay(0, 0, false);
}

function checkAnswers() {
  const inputs = document.querySelectorAll('.blank-input');
  let correctCount = 0;
  let totalCount = 0;

  inputs.forEach(input => {
    const userVal = input.value.trim().replace(/\s+/g, '');
    const correctVal = input.dataset.ans.trim().replace(/\s+/g, '');
    
    totalCount++;

    if (userVal === correctVal && userVal !== '') {
      input.classList.remove('incorrect');
      input.classList.add('correct');
      correctCount++;
    } else {
      input.classList.remove('correct');
      input.classList.add('incorrect');
    }
  });

  updateScoreDisplay(correctCount, totalCount, true);
}

function toggleAnswers() {
  showAnswers = !showAnswers;
  const hints = document.querySelectorAll('.ans-hint');
  hints.forEach(hint => {
    if (showAnswers) {
      hint.classList.remove('hidden');
    } else {
      hint.classList.add('hidden');
    }
  });
}

function resetInputs() {
  const inputs = document.querySelectorAll('.blank-input');
  inputs.forEach(input => {
    input.value = '';
    input.classList.remove('correct', 'incorrect');
  });
  updateScoreDisplay(0, 0, false);
}

function updateScoreDisplay(correct, total, isChecked) {
  const display = document.getElementById('scoreDisplay');
  if (!isChecked) {
    const currentBlanks = document.querySelectorAll('.blank-input').length;
    display.textContent = `총 빈칸: ${currentBlanks}개`;
  } else {
    const percentage = Math.round((correct / total) * 100);
    display.textContent = `점수: ${correct} / ${total} (${percentage}점)`;
  }
}
</script>
</body>
</html>
